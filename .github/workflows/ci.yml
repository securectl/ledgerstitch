# LedgerStitch Community CI: tests (3 OSes x 2 Pythons), lint, secrets scan, SBOM.
# Every job runs the AGPL core alone: no proprietary add-on is installed or needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows support is new (the Windows build is still "coming soon"), so its failures are
    # reported but don't block merges yet. Remove this line once the Windows job is green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      LEDGERSTITCH_EDITION: community
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -rf --junitxml=junit.xml
      - name: Report failing tests as annotations (readable without signing in)
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("junit.xml").getroot()
          except Exception as e:
              print(f"::error title=pytest::no junit.xml ({e}); the suite didn't start, see the Test step")
              raise SystemExit(0)
          n = 0
          for tc in root.iter("testcase"):
              for bad in list(tc.findall("failure")) + list(tc.findall("error")):
                  msg = (bad.get("message") or (bad.text or "")).strip().splitlines()
                  first = (msg[0] if msg else "")[:300].replace("%", "%25").replace("\n", " ")
                  print(f"::error title={tc.get('classname')}.{tc.get('name')}::{first}")
                  n += 1
                  if n >= 40:
                      raise SystemExit(0)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff (syntax errors and undefined names)
        run: |
          python -m pip install "ruff==0.6.9"
          ruff check --select E9,F63,F7,F82 ledgerstitch tests packaging scripts
      - name: Byte-compile
        run: python -m compileall -q ledgerstitch
      - name: SPDX headers on core sources
        run: |
          missing=$(grep -L "SPDX-License-Identifier: AGPL-3.0-only" $(git ls-files 'ledgerstitch/*.py') || true)
          if [ -n "$missing" ]; then echo "Missing AGPL SPDX header:"; echo "$missing"; exit 1; fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # scan the whole history, not just the last commit
      - name: Install Betterleaks (pinned, checksum-verified)
        env:
          BETTERLEAKS_VERSION: "1.9.0"
          BETTERLEAKS_SHA256: "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7"
        run: |
          f="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/$f"
          echo "${BETTERLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" -C /usr/local/bin betterleaks
          betterleaks version
      - name: Scan full history (uses .betterleaks.toml)
        run: betterleaks git --redact --verbose --exit-code 1 .

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build SBOM (CycloneDX) of the runtime dependencies
        run: |
          python -m venv /tmp/sbom-venv
          /tmp/sbom-venv/bin/pip install -q .
          python -m pip install -q "cyclonedx-bom>=4,<5"
          cyclonedx-py environment /tmp/sbom-venv/bin/python --output-format JSON --outfile sbom.cdx.json --output-reproducible
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
